<!doctype html>
<html lang="en">
    <head>
        <title>COM 313 Midterm</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="format.css">

    </head>
    <body>
    <div id="gridContainer"></div>

    <div id="settingsContainer">
        <div id="sliderContainer">
            <div id="rowSliderDiv" class="sliderDiv">
                <input
                        type="range"
                        id="rowSlider"
                        name="rowSlider"
                        value="10"
                        min="3"
                        max="15"
                        step="1"
                />
                <label for="rowSlider">Rows</label>
                <p>Rows: <strong><span id="rowValue"></span></strong></p>
            </div>

            <div id="colSliderDiv" class="sliderDiv">
                <input
                        type="range"
                        id="colSlider"
                        name="colSlider"
                        value="10"
                        min="3"
                        max="15"
                        step="1"
                />
                <label for="colSlider">Columns</label>
                <p>Columns: <strong><span id="colValue"></span></strong></p>
            </div>
        </div>
        <div id="buttonContainer">
            <div id="altruistButton" class="agentButton">
                <p>Altruist</p>
            </div>
            <div id="egoistButton" class="agentButton">
                <p>Egoist</p>
            </div>
            <div id="hooliganButton" class="agentButton">
                <p>Hooligan</p>
            </div>
        </div>

        <div id="resetButton">
            <p><strong>RESET</strong></p>
        </div>

        <div id="advanceButton">
            <p><strong>Advance</strong></p>
        </div>

        <div id="runButton">
            <p><strong>Run</strong></p>
        </div>

        <div id="speedSliderDiv">
            <input
                    type="range"
                    id="speedSlider"
                    name="speedSlider"
                    value="15"
                    min="1"
                    max="30"
                    step="1"
            />
            <label for="speedSlider">Game Speed</label>
            <p>Speed: <strong><span id="speedValue"></span></strong></p>
        </div>

        <div id="randomContainer">
            <div id="2575Button" class="agentButton">
                <p>25-75 Split</p>
            </div>
            <div id="5050Button" class="agentButton">
                <p>50-50 Split</p>
            </div>
            <div id="7525Button" class="agentButton">
                <p>75-25 Split</p>
            </div>
        </div>

        <div id="randomSliderDiv">
            <input
                    type="range"
                    id="randomSlider"
                    name="randomSlider"
                    value="50"
                    min="0"
                    max="100"
                    step="1"
            />
            <label for="randomSlider"><span id="randomValue"></span> % altruists</label>
            <div id="generateButton" class="agentButton">
                Generate
            </div>
        </div>
    </div>

        <script src="script.js"></script>
    </body>
</html>
