<!doctype html>
<html lang="en">
    <head>
        <title>COM 313 Midterm</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="format.css">

    </head>
    <body>
    <div id="gridContainer"></div>

    <div>
        <input
                type="range"
                id="rowSlider"
                name="rowSlider"
                value="3"
                min="3"
                max="20"
                step="1"
        />
        <label for="rowSlider">Rows</label>
        <p>Rows: <span id="rowValue"></span></p>
    </div>

    <div>
        <input
                type="range"
                id="colSlider"
                name="colSlider"
                value="3"
                min="3"
                max="20"
                step="1"
        />
        <label for="colSlider">Columns</label>
        <p>Columns: <span id="colValue"></span></p>
    </div>
        <script src="script.js"></script>
    </body>
</html>
